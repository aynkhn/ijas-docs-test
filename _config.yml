title: IJAS Policy & Procedure Manual
description: Illinois Junior Academy of Science Policy & Procedure Manual, effective September 2026 through August 2028.
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

baseurl: "/ijas-docs-test"

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Back to IJAS Website": "https://www.ijas.org"
aux_links_new_tab: true

color_scheme: ijas

callouts:
  warning:
    title: Warning
    color: red
  important:
    title: Important
    color: yellow
  note:
    title: Note
    color: blue

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
